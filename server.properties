# ===== Cấu hình Server =====
server.port=9000
media.port=9001
storage.dir=storage

# TLS cho Kênh 1 (đặt false để debug nhanh bằng TCP thường; nhớ bật lại khi demo/Wireshark)
tls.enabled=true
tls.keystore=server.jks
tls.keystorePassword=changeit

# MySQL / MariaDB (đã chạy db/schema.sql)
db.host=localhost
db.port=3306
db.name=zalo_network_app
db.user=root
db.password=1234

# ===== Thành viên 1: vận hành =====
log.file=server.log
max.connections=500
